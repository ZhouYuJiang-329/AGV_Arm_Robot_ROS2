navigation_guard:
  ros__parameters:
    use_sim_time: false
    # Deliberate commissioning gates. Do not enable from an unattended launch.
    motion_enabled: false
    input_freshness_contract_verified: false
    cmd_vel_timeout: 0.5
    controller_duration_ms: 800
    request_timeout_ms: 150
    stop_attempts: 2
    max_linear_speed: 0.15
    max_angular_speed: 0.2
    required_scan_topics: [/scan_front, /scan_back]
    scan_timeout: 0.6
    odom_timeout: 0.6
    required_tf_edges: ['map->odom', 'odom->base_link']
    tf_timeout: 0.8
    localization_diagnostic: /seer_localization/map_to_odom
    localization_timeout: 0.8
    stopped_linear_threshold: 0.01
    stopped_angular_threshold: 0.02
    stopped_hold_sec: 0.5
