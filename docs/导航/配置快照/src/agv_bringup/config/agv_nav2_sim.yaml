# Simulator-only starting configuration. Footprint and initial pose are filled
# from agv_navigation_scene.yaml; these are not calibrated real-chassis settings.
amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    robot_model_type: nav2_amcl::OmniMotionModel
    alpha1: 0.02
    alpha2: 0.02
    alpha3: 0.02
    alpha4: 0.02
    alpha5: 0.02
    min_particles: 500
    max_particles: 1500
    max_beams: 90
    laser_max_range: 12.0
    laser_min_range: 0.08
    laser_likelihood_max_dist: 2.0
    laser_model_type: likelihood_field
    sigma_hit: 0.15
    z_hit: 0.8
    z_rand: 0.2
    update_min_d: 0.05
    update_min_a: 0.05
    transform_tolerance: 0.5
    set_initial_pose: true
    initial_pose: {x: -4.0, y: -4.0, z: 0.0, yaw: 0.0}
    always_reset_initial_pose: true
    tf_broadcast: true
map_server:
  ros__parameters:
    use_sim_time: true
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose: {plugin: nav2_bt_navigator::NavigateToPoseNavigator}
    navigate_through_poses: {plugin: nav2_bt_navigator::NavigateThroughPosesNavigator}
controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: -0.35
      max_vel_x: 0.45
      min_vel_y: -0.35
      max_vel_y: 0.35
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.45
      min_speed_theta: 0.0
      acc_lim_x: 0.6
      acc_lim_y: 0.6
      acc_lim_theta: 1.2
      decel_lim_x: -0.6
      decel_lim_y: -0.6
      decel_lim_theta: -1.2
      vx_samples: 12
      vy_samples: 9
      vtheta_samples: 16
      sim_time: 1.8
      linear_granularity: 0.05
      angular_granularity: 0.05
      transform_tolerance: 0.3
      short_circuit_trajectory_evaluation: true
      stateful: true
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.03
      critics: [RotateToGoal, Oscillation, BaseObstacle, ObstacleFootprint, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.02
      ObstacleFootprint.scale: 0.02
      PathAlign.scale: 16.0
      PathAlign.forward_point_distance: 0.2
      GoalAlign.scale: 12.0
      GoalAlign.forward_point_distance: 0.2
      PathDist.scale: 24.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 3.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[-0.425,-0.675],[0.425,-0.675],[0.425,0.675],[-0.425,0.675]]"
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan: {topic: /scan, data_type: LaserScan, clearing: true, marking: true,
               min_obstacle_height: 0.0, max_obstacle_height: 2.0,
               raytrace_max_range: 10.0, raytrace_min_range: 0.08, obstacle_max_range: 8.0, obstacle_min_range: 0.08}
      inflation_layer: {plugin: nav2_costmap_2d::InflationLayer, cost_scaling_factor: 3.0, inflation_radius: 0.9}
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[-0.425,-0.675],[0.425,-0.675],[0.425,0.675],[-0.425,0.675]]"
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer: {plugin: nav2_costmap_2d::StaticLayer, map_subscribe_transient_local: true}
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan: {topic: /scan, data_type: LaserScan, clearing: true, marking: true,
               min_obstacle_height: 0.0, max_obstacle_height: 2.0,
               raytrace_max_range: 10.0, raytrace_min_range: 0.08, obstacle_max_range: 8.0, obstacle_min_range: 0.08}
      inflation_layer: {plugin: nav2_costmap_2d::InflationLayer, cost_scaling_factor: 3.0, inflation_radius: 0.9}
      always_send_full_costmap: true
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased: {plugin: nav2_navfn_planner::NavfnPlanner, tolerance: 0.2, use_astar: true, allow_unknown: false}
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother: {plugin: nav2_smoother::SimpleSmoother, tolerance: 1.0e-10, max_its: 1000, do_refinement: true}
behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin: {plugin: nav2_behaviors::Spin}
    backup: {plugin: nav2_behaviors::BackUp}
    wait: {plugin: nav2_behaviors::Wait}
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.15
    rotational_acc_lim: 1.2
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    max_velocity: [0.45, 0.35, 0.8]
    min_velocity: [-0.35, -0.35, -0.8]
    max_accel: [0.6, 0.6, 1.2]
    max_decel: [-0.6, -0.6, -1.2]
    odom_topic: odom
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.4
collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.3
    source_timeout: 1.0
    stop_pub_timeout: 1.0
    polygons: [FootprintApproach]
    FootprintApproach: {type: polygon, action_type: approach, footprint_topic: /local_costmap/published_footprint,
                        time_before_collision: 0.7, simulation_time_step: 0.1, min_points: 3, enabled: true}
    observation_sources: [scan]
    scan: {type: scan, topic: scan, min_height: 0.0, max_height: 2.0, enabled: true}
