syntax = "proto3";
package rbk.protocol;
message Message_Header {
	uint64 pub_nsec = 1;
	uint64 data_nsec = 2;
	uint64 seq = 3;
	string frame_id = 4;
}
message Message_getMsgInfo {
    Message_Header header = 1;
    string plugin_name=2;
    string message_name=3;
    uint64 message_time=4;
}