# Site-only fixed tucked-arm profile: footprint is 1.25 x 0.75 m including 5cm per-edge margin.
# Preserve base_link long side along Y; independently verify centering/axes before release.
# Added independent STOP region 0.15m outside footprint; 0.10m included only two rear beams in recorded fixture.
# No navigation execution gates are released by this file.
map_server:
  ros__parameters:
    use_sim_time: false
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
controller_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.1
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: -0.05
      max_vel_x: 0.05
      min_vel_y: -0.05
      max_vel_y: 0.05
      max_vel_theta: 0.1
      min_speed_xy: 0.0
      max_speed_xy: 0.05
      min_speed_theta: 0.0
      acc_lim_x: 0.1
      acc_lim_y: 0.1
      acc_lim_theta: 0.2
      decel_lim_x: -0.1
      decel_lim_y: -0.1
      decel_lim_theta: -0.2
      vx_samples: 12
      vy_samples: 7
      vtheta_samples: 16
      sim_time: 1.8
      linear_granularity: 0.05
      angular_granularity: 0.05
      transform_tolerance: 0.3
      short_circuit_trajectory_evaluation: true
      stateful: true
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.01
      critics:
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - ObstacleFootprint
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      BaseObstacle.scale: 0.02
      ObstacleFootprint.scale: 0.02
      PathAlign.scale: 16.0
      PathAlign.forward_point_distance: 0.2
      GoalAlign.scale: 12.0
      GoalAlign.forward_point_distance: 0.2
      PathDist.scale: 24.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 3.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: '[[-0.375,-0.625],[0.375,-0.625],[0.375,0.625],[-0.375,0.625]]'
      plugins:
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: agv_bringup::MeasuredRayObstacleLayer
        clearing_max_age_sec: 0.6
        observation_sources: front back
        min_obstacle_height: -1.0
        max_obstacle_height: 1.0
        footprint_clearing_enabled: false
        front:
          topic: /scan_front
          sensor_frame: laser_front_link
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: false
          min_obstacle_height: -1.0
          max_obstacle_height: 1.0
          observation_persistence: 0.0
          expected_update_rate: 0.6
          raytrace_min_range: 0.0
          raytrace_max_range: 4.0
          obstacle_min_range: 0.0
          obstacle_max_range: 3.5
        back:
          topic: /scan_back
          sensor_frame: laser_back_link
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: false
          min_obstacle_height: -1.0
          max_obstacle_height: 1.0
          observation_persistence: 0.0
          expected_update_rate: 0.6
          raytrace_min_range: 0.0
          raytrace_max_range: 4.0
          obstacle_min_range: 0.0
          obstacle_max_range: 3.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 1.65
      always_send_full_costmap: true
      footprint_padding: 0.0
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: '[[-0.375,-0.625],[0.375,-0.625],[0.375,0.625],[-0.375,0.625]]'
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: agv_bringup::MeasuredRayObstacleLayer
        clearing_max_age_sec: 0.6
        observation_sources: front back
        min_obstacle_height: -1.0
        max_obstacle_height: 1.0
        footprint_clearing_enabled: false
        front:
          topic: /scan_front
          sensor_frame: laser_front_link
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: false
          min_obstacle_height: -1.0
          max_obstacle_height: 1.0
          observation_persistence: 0.0
          expected_update_rate: 0.6
          raytrace_min_range: 0.0
          raytrace_max_range: 4.0
          obstacle_min_range: 0.0
          obstacle_max_range: 3.5
        back:
          topic: /scan_back
          sensor_frame: laser_back_link
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: false
          min_obstacle_height: -1.0
          max_obstacle_height: 1.0
          observation_persistence: 0.0
          expected_update_rate: 0.6
          raytrace_min_range: 0.0
          raytrace_max_range: 4.0
          obstacle_min_range: 0.0
          obstacle_max_range: 3.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 1.65
      always_send_full_costmap: true
      footprint_padding: 0.0
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.2
      use_astar: true
      allow_unknown: false
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.1
    min_rotational_vel: 0.03
    rotational_acc_lim: 0.2
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    max_velocity:
    - 0.05
    - 0.05
    - 0.1
    min_velocity:
    - -0.05
    - -0.05
    - -0.1
    max_accel:
    - 0.1
    - 0.1
    - 0.2
    max_decel:
    - -0.1
    - -0.1
    - -0.2
    odom_topic: /odom
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.35
    scale_velocities: true
collision_monitor:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /navigation/cmd_vel_smoothed
    cmd_vel_out_topic: /navigation/cmd_vel_guard
    state_topic: collision_monitor_state
    transform_tolerance: 0.3
    source_timeout: 0.6
    stop_pub_timeout: 1.0
    polygons:
    - FootprintStop
    - FootprintApproach
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.5
      simulation_time_step: 0.1
      min_points: 3
      enabled: true
    observation_sources:
    - front
    - back
    front:
      type: scan
      topic: /scan_front
      enabled: true
    back:
      type: scan
      topic: /scan_back
      enabled: true
    FootprintStop:
      type: polygon
      action_type: stop
      points: '[[-0.525,-0.775],[0.525,-0.775],[0.525,0.775],[-0.525,0.775]]'
      min_points: 3
      enabled: true
      visualize: true
      polygon_pub_topic: /navigation/footprint_stop_zone
